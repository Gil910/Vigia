name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check vigia/ tests/ scripts/
      - run: pytest

  corpus:
    # The seed files are the part of this repo most likely to break silently:
    # a hand-edited JSON with a missing field takes the whole campaign down at
    # runtime instead of at review time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate seed schema and taxonomy IDs
        run: python scripts/validate_corpus.py

  preflight:
    # Everything the repository claims about itself that a machine can check:
    # the numbers trace to the database, the links resolve, the commands in the
    # documentation exist, no exfiltration destination is a domain somebody could
    # register. `--full` — build, twine, clean install — runs before a release,
    # not on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/preflight.py
